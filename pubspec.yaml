name: aqua_mind
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.2
  device_preview: ^1.1.0
  font_awesome_flutter: ^10.12.0
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  google_mobile_ads: ^5.0.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  permission_handler: ^11.0.1
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.11.0   # <- ikon paketi eklendi

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  generate: true

# flutter_intl yapılandırması
flutter_intl:
  enabled: true

# flutter_launcher_icons yapılandırması
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/appicon.png"   # <- ikon dosyanın yolu
  remove_alpha_ios: true