name: aqua_mind
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.2
  device_preview: ^1.1.0
  font_awesome_flutter: ^10.12.0
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8
  provider: ^6.1.1

  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/

  generate: true

# l10n yapılandırması en üst seviyede, flutter bölümünün dışında
flutter_intl:
  enabled: true